<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">
<header th:insert="bloks/header :: header"> </header>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="card p-4 shadow border-0 bg-white rounded-4" style="width: 100%; max-width: 420px;">
        <div class="text-center mb-4">
            <span class="fs-1">🌱</span>
            <h3 class="fw-bold text-dark mt-2">Реєстрація</h3>
            <p class="text-muted small">Створіть профіль для швидких покупок</p>
        </div>

        <div th:if="${error}" class="alert alert-danger rounded-3 py-2 small text-center" role="alert" th:text="${error}">
            Помилка
        </div>

        <form th:action="@{/register}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label small fw-medium text-secondary">Придумайте логін</label>
                <input type="text" id="username" name="username" class="form-control rounded-3 shadow-sm" required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label small fw-medium text-secondary">Придумайте пароль</label>
                <input type="password" id="password" name="password" class="form-control rounded-3 shadow-sm" required>
            </div>

            <button type="submit" class="btn btn-success w-100 btn-lg rounded-3 fw-semibold mb-3 shadow-sm" style="background-color: #2e7d32; border-color: #2e7d32;">
                Створити акаунт
            </button>

            <div class="text-center small">
                <span class="text-muted">Вже зареєстровані?</span>
                <a href="/login" class="text-success fw-medium text-decoration-none ms-1">Увійти</a>
            </div>
        </form>
    </div>
</div>

<footer th:insert="bloks/footer :: footer"> </footer>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Редагування товару</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">
<header th:insert="bloks/header :: header"> </header>

<div class="container my-5" style="max-width: 700px;">
    <div class="mb-4">
        <a th:href="'/shop/product/' + ${product.id}" class="text-nav-link fw-medium text-decoration-none">
            ← Скасувати та повернутися
        </a>
    </div>

    <div class="card border border-secondary-subtle rounded-4 bg-white p-4 shadow-sm">
        <h3 class="fw-bold text-dark text-center mb-4">Редагування товару</h3>

        <form th:action="'/shop/product/' + ${product.id} + '/edit'" method="post" enctype="multipart/form-data">

            <div class="mb-3">
                <label for="title" class="form-label fw-medium text-dark">Назва товару</label>
                <input type="text" name="title" id="title" th:value="${product.title}" class="form-control rounded-2" required>
            </div>

            <div class="mb-3">
                <label for="price" class="form-label fw-medium text-dark">Ціна</label>
                <input type="number" step="0.01" name="price" id="price" th:value="${product.price}" class="form-control rounded-2" required>
            </div>

            <div class="mb-3">
                <label for="text" class="form-label fw-medium text-dark">Детальний опис</label>
                <textarea name="text" id="text" rows="5" th:text="${product.text}" class="form-control rounded-2" required></textarea>
            </div>

            <div class="mb-4">
                <label for="file" class="form-label fw-medium text-dark">Зображення товару</label>
                <input type="file" name="file" id="file" class="form-control rounded-2">
            </div>

            <div class="row g-3">
                <div class="col-sm-6">
                    <button type="submit" class="btn btn-success py-2 rounded-2 fw-medium w-100 fs-5">
                        Зберегти
                    </button>
                </div>
                <div class="col-sm-6">
                    <a th:href="'/shop/product/' + ${product.id}" class="btn btn-outline-secondary py-2 rounded-2 fw-medium w-100 fs-5">
                        Скасувати
                    </a>
                </div>
            </div>

        </form>
    </div>
</div>

<footer th:insert="bloks/footer :: footer"> </footer>
</body>
</html>

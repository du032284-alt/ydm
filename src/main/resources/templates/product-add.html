<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Додавання товару</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">
<header th:insert="bloks/header :: header"> </header>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm bg-white rounded-3 p-4">

                <h3 class="fw-bold text-dark mb-4">Додати новий товар</h3>

                <form th:action="'/shop/category/' + ${categoryId} + '/product/add'" method="post" enctype="multipart/form-data">

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Назва товару</label>
                        <input type="text" name="title" class="form-control rounded-2" placeholder="Введіть назву..." required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Ціна (грн)</label>
                        <input type="number" step="0.01" name="price" class="form-control rounded-2" placeholder="0.00" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Фото товару</label>
                        <input type="file" name="file" accept="image/*" class="form-control rounded-2">
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small fw-semibold">Опис товару</label>
                        <textarea name="text" rows="4" class="form-control rounded-2" placeholder="Опишіть товар..." required></textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success rounded-2 px-4 py-2 fw-medium w-100">Додати товар</button>
                        <a th:href="'/shop/category/' + ${categoryId} + '/products'" class="btn btn-light rounded-2 px-4 py-2 fw-medium w-100 border text-muted">Скасувати</a>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>

<footer th:insert="bloks/footer :: footer"> </footer>
</body>
</html>

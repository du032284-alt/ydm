<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="uk">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Кошик</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">
<header th:insert="bloks/header :: header"> </header>

<div class="container my-5" style="max-width: 900px;">
    <h2 class="fw-bold text-dark mb-4 text-center">🛒 Кошик</h2>

    <div th:if="${#lists.isEmpty(cartItems)}" class="text-center py-5 bg-white rounded-4 border border-secondary-subtle shadow-sm">
        <h4 class="text-muted mb-4">Ваш кошик поки що порожній...</h4>
        <a href="/shop" class="btn btn-success rounded-2 px-4 py-2 fw-medium">Перейти до покупок</a>
    </div>

    <div th:unless="${#lists.isEmpty(cartItems)}">
        <div class="card border-0 rounded-4 bg-white p-4 shadow-sm mb-4">
            <table class="table align-middle">
                <thead>
                <tr class="text-muted small">
                    <th scope="col" style="width: 100px;">Фото</th>
                    <th scope="col">Товар</th>
                    <th scope="col" class="text-center" style="width: 140px;">Кількість</th>
                    <th scope="col" class="text-end">Ціна</th>
                    <th scope="col" class="text-center" style="width: 80px;">Дія</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${cartItems}">
                    <td>
                        <div class="bg-light rounded-3 overflow-hidden text-center" style="width: 60px; height: 60px;">
                            <img th:if="${item.product.image != null and item.product.image != ''}"
                                 th:src="'/images/' + ${item.product.image}"
                                 class="img-fluid" style="height: 100%; width: 100%; object-fit: cover;" alt="product-image">
                        </div>
                    </td>
                    <td>
                        <h6 class="fw-bold text-dark m-0" th:text="${item.product.title}"></h6>
                        <span th:if="${item.product.isOnSale()}" class="badge bg-danger rounded-pill mt-1" style="font-size: 0.75rem;"
                              th:text="'Акція -' + ${#numbers.formatDecimal(item.product.discount, 0, 0)} + '%'"></span>
                    </td>

                    <td class="text-center">
                        <div class="d-inline-flex border border-secondary-subtle bg-white custom-quantity-picker">
                            <form th:action="'/cart/update/' + ${item.id}" method="post" class="m-0">
                                <input type="hidden" name="quantity" th:value="${item.quantity - 1}">
                                <button type="submit"
                                        th:disabled="${item.quantity <= 1}"
                                        class="btn btn-link text-dark text-decoration-none px-3 py-1 border-0 fw-bold">-</button>
                            </form>

                            <div class="d-flex align-items-center justify-content-center border-start border-end border-secondary-subtle px-4 fw-medium text-dark bg-light-subtle"
                                 style="min-width: 50px;"
                                 th:text="${item.quantity}">
                                1
                            </div>

                            <form th:action="'/cart/update/' + ${item.id}" method="post" class="m-0">
                                <input type="hidden" name="quantity" th:value="${item.quantity + 1}">
                                <button type="submit" class="btn btn-link text-dark text-decoration-none px-3 py-1 border-0 fw-bold">+</button>
                            </form>
                        </div>
                    </td>

                    <td class="text-end">
                        <div th:if="${item.product.isOnSale()}">
                            <div class="text-muted text-decoration-line-through small"
                                 th:text="${#numbers.formatDecimal(item.product.calculatePrice() * item.quantity, 1, 2)} + ' грн'"></div>
                            <div class="fw-bold text-success"
                                 th:text="${#numbers.formatDecimal(item.product.calculatePrice(item.product.discount) * item.quantity, 1, 2)} + ' грн'"></div>
                        </div>
                        <div th:unless="${item.product.isOnSale()}" class="fw-bold text-success"
                             th:text="${#numbers.formatDecimal(item.product.calculatePrice() * item.quantity, 1, 2)} + ' грн'"></div>
                    </td>

                    <td>
                        <form th:action="'/cart/delete/' + ${item.id}" method="post" class="text-center m-0">
                            <button type="submit" class="btn btn-sm btn-outline-danger border-0 fs-5">🗑️</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <div class="d-flex justify-content-between align-items-center border-top pt-4 mt-3">
                <form th:action="'/cart/clear'" method="post" onsubmit="return confirm('Очистити весь кошик?');" class="m-0">
                    <button type="submit" class="btn btn-outline-secondary btn-sm rounded-2 px-3 py-2 fw-medium">
                        Очистити кошик
                    </button>
                </form>
                <div class="text-end">
                    <span class="text-muted me-2 fs-5">Разом до сплати:</span>
                    <span class="fs-3 fw-bold text-success" th:text="${totalPrice} + ' грн'"></span>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between">
            <a href="/shop" class="btn btn-outline-success rounded-2 px-4 py-2 fw-medium">
                ← Продовжити покупки
            </a>
            <a href="/order" class="btn btn-success btn-lg rounded-3 fw-semibold main-btn shadow-sm" style="padding: 12px 28px; background-color: #2e7d32; border-color: #2e7d32;">
                Оформити замовлення →
            </a>
        </div>
    </div>
</div>

<footer th:insert="bloks/footer :: footer"> </footer>
</body>
</html>

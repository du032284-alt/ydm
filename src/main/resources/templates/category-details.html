<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Деталі категорії</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">
<header th:insert="bloks/header :: header"> </header>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-0 shadow-sm bg-white rounded-3 p-4">

                <span class="text-uppercase text-muted tracking-wider small fw-semibold mb-1">Деталі</span>
                <h2 class="fw-bold text-dark mb-4" th:text="${category.name}">Назва категорії</h2>

                <div class="mb-4 text-center">
                    <img th:if="${category.icon != null and category.icon != ''}" th:src="'/images/' + ${category.icon}" class="img-fluid rounded-3 w-100" style="max-height: 300px; object-fit: cover;">
                    <img th:unless="${category.icon != null and category.icon != ''}" src="/images/Насіння.png" class="img-fluid rounded-3 w-100" style="max-height: 300px; object-fit: cover;">
                </div>

                <div class="mb-4 border-top border-light pt-3">
                    <h5 class="fw-bold text-dark">Опис:</h5>
                    <p class="text-muted" th:text="${category.description}"></p>
                </div>

                <div class="d-flex justify-content-between align-items-center border-top border-light pt-3">
                    <a href="/shop" class="text-success small fw-medium text-decoration-none">Назад до категорій</a>

                    <div class="d-flex gap-2">
                        <a th:href="'/shop/category/' + ${category.id} + '/edit'" class="btn btn-warning btn-sm px-4 py-2 rounded-2 fw-medium text-dark">
                            Редагувати
                        </a>

                        <form th:action="'/shop/category/' + ${category.id} + '/delete'" method="post" class="m-0">
                            <button type="submit" class="btn btn-danger btn-sm px-4 py-2 rounded-2 fw-medium">
                                Видалити
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:insert="bloks/footer :: footer"> </footer>
</body>
</html>

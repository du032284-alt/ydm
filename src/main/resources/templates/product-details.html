<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Деталі товару</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">
<header th:insert="bloks/header :: header"> </header>

<div class="container my-4 d-flex justify-content-between align-items-center">
    <a th:href="'/shop/category/' + ${product.category.id} + '/products'" class="text-nav-link text-decoration-none fw-medium m-0">
        ← Назад до списку товарів
    </a>
</div>

<div class="container my-5">

    <div class="row g-5 bg-white p-4 rounded-4 shadow-sm border border-secondary-subtle">
        <div class="col-md-5">
            <div class="bg-light rounded-3 overflow-hidden text-center p-3" style="max-height: 400px;">
                <img th:if="${product.image != null and product.image != ''}"
                     th:src="'/images/' + ${product.image}"
                     class="img-fluid rounded"
                     style="max-height: 350px; object-fit: cover;">
            </div>
        </div>

        <div class="col-md-7 d-flex flex-column justify-content-between">
            <div>
                <span class="badge bg-success-subtle text-success mb-2 px-3 py-2 rounded-pill fw-medium" th:text="${product.category.name}">Категорія</span>
                <h2 class="fw-bold text-dark mb-3" th:text="${product.title}">Назва товару</h2>

                <!-- Варіант з активною акцією -->
                <div th:if="${product.isOnSale()}" class="mb-3">
                    <div class="d-flex align-items-center gap-2 mb-1">
                        <span class="badge bg-danger rounded-pill px-2 py-1 small"
                              th:text="'🔥 Акція -' + ${#numbers.formatDecimal(product.discount, 0, 0)} + '%'">
                        </span>
                        <span class="text-muted text-decoration-line-through fs-5">
                            <span th:text="${product.calculatePrice()}">0.00</span> грн
                        </span>
                    </div>
                    <div class="fs-2 fw-bold text-success">
                        <span th:text="${#numbers.formatDecimal(product.calculatePrice(product.discount), 1, 2)}">0.00</span>
                        <span class="fs-4 fw-normal text-dark">грн</span>
                    </div>
                </div>

                <!-- Звичайний товар без знижки -->
                <div th:unless="${product.isOnSale()}" class="fs-2 fw-bold text-success mb-3">
                    <span th:text="${product.calculatePrice()}">0.00</span>
                    <span class="fs-4 fw-normal text-dark">грн</span>
                </div>


                <h5 class="fw-bold text-dark mb-2">Опис товару:</h5>
                <p class="text-muted lh-base" style="white-space: pre-wrap;" th:text="${product.text}">Опис</p>
            </div>

            <div class="mt-4 border-top pt-4">
                <form th:action="'/cart/add/' + ${product.id}" method="post" class="m-0 mb-4" style="max-width: 320px;">
                    <label class="form-label text-muted small fw-medium">Оберіть кількість товарів:</label>

                    <div class="d-flex gap-2 align-items-center">
                        <input type="number" name="quantity" value="1" min="1" max="99"
                               class="form-control text-center rounded-pill"
                               style="max-width: 75px; height: 44px; font-weight: 500;">

                        <button type="submit" class="btn btn-success px-4 rounded-pill fw-medium flex-grow-1" style="height: 44px;">
                            Купити
                        </button>
                    </div>
                </form>

                <div class="d-flex gap-2">
                    <a th:href="'/shop/product/' + ${product.id} + '/edit'" class="btn btn-outline-secondary px-4 py-2 rounded-2 fw-medium">
                        Редагувати
                    </a>

                    <form th:action="'/shop/product/' + ${product.id} + '/delete'" method="post" onsubmit="return confirm('Ви впевнені, що хочете видалити цей товар?');" class="m-0">
                        <button type="submit" class="btn btn-outline-danger px-4 py-2 rounded-2 fw-medium">
                            Видалити
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<footer th:insert="bloks/footer :: footer"> </footer>
</body>
</html>

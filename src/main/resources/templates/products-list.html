<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Товари</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">
<header th:insert="bloks/header :: header"> </header>

<div class="container my-5">
    <h2 class="fw-bold text-dark mb-4 text-center" th:text="${pageTitle}"></h2>

    <div class="container my-4 d-flex justify-content-between align-items-center">
        <a href="/shop" class="text-nav-link text-decoration-none fw-medium m-0 hover-underline">
            ← Назад до категорій
        </a>
        <a th:if="${categoryId != null}" th:href="'/shop/category/' + ${categoryId} + '/product/add'" class="btn btn-success rounded-3 px-4 py-2 fw-medium m-0 btn-add-category">
            + Додати товар
        </a>
    </div>

    <div th:if="${#lists.isEmpty(products)}" class="alert alert-neutral text-center text-muted bg-white rounded-3 shadow-sm py-4">
        У цій категорії поки що немає доступних товарів.
    </div>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" th:unless="${#lists.isEmpty(products)}">
        <div class="col" th:each="product : ${products}">
            <div class="card h-100 border-0 rounded-4 bg-white p-3 d-flex flex-column justify-content-between custom-card">
                <div>
                    <a th:href="'/shop/product/' + ${product.id}" class="text-decoration-none">
                        <div class="text-center mb-3 rounded-3 img-container" style="height: 250px;">
                            <img th:if="${product.image != null and product.image != ''}"
                                 th:src="'/images/' + ${product.image}"
                                 class="img-fluid category-img" alt="product-image">
                        </div>
                    </a>
                    <a th:href="'/shop/product/' + ${product.id}" class="text-decoration-none">
                        <h5 class="fw-bold text-dark lh-sm text-start mb-3" th:text="${product.title}">Назва товару</h5>
                    </a>
                </div>

                <div class="mt-auto">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="fs-3 fw-bold text-success">
                            <span th:text="${product.price}">0.00</span> <span class="fs-5 fw-normal text-muted">грн</span>
                        </div>

                        <form th:action="'/cart/add/' + ${product.id}" method="post" class="m-0">
                            <input type="hidden" name="quantity" value="1">
                            <button type="submit" class="btn btn-success rounded-pill px-4 py-2 fw-medium btn-sm">
                                КУПИТИ
                            </button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:insert="bloks/footer :: footer"> </footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Оформлення замовлення</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">
<header th:insert="bloks/header :: header"> </header>

<div class="container my-5" style="max-width: 1000px;">
    <div class="row g-4">

        <!-- Форма оформлення замовлення -->
        <div class="col-md-7">
            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                <h3 class="fw-bold text-dark mb-4">Оформлення замовлення</h3>

                <form th:action="@{/orders/create}" method="post" id="orderForm">

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Ім'я та Прізвище</label>
                        <input type="text" name="customerName" class="form-control rounded-3 py-2" placeholder="Введіть ваше ім'я" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Номер телефону</label>
                        <input type="tel" name="customerPhone" class="form-control rounded-3 py-2" placeholder="+380" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small fw-semibold">Адреса доставки (Нова Пошта / Укрпошта)</label>
                        <textarea name="shippingAddress" rows="3" class="form-control rounded-3" placeholder="Місто, номер відділення або вулиця..." required></textarea>
                    </div>

                    <input type="hidden" name="useBonuses" id="hiddenUseBonuses" value="false">
                    <input type="hidden" name="totalSum" id="hiddenTotalSum" th:value="${totalPrice}">

                    <button type="submit" class="btn btn-success w-100 py-3 rounded-3 fw-bold fs-5 shadow-sm" style="background-color: #2e7d32; border-color: #2e7d32;">
                        Підтвердити замовлення
                    </button>
                </form>
            </div>
        </div>

        <!-- Склад замовлення з відображенням знижок -->
        <div class="col-md-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                <h4 class="fw-bold text-dark mb-4">Ваше замовлення</h4>

                <div class="d-flex flex-column gap-3 mb-4">
                    <div th:each="item : ${cartItems}" class="d-flex justify-content-between align-items-start border-bottom pb-3">
                        <div>
                            <h6 class="fw-bold text-dark mb-1" th:text="${item.product.title}">Товар</h6>

                            <!-- Відображення для акційного товару  -->
                            <div th:if="${item.product.isOnSale()}" class="d-flex align-items-center gap-1">
                                <span class="badge bg-danger rounded-pill px-2 py-0" style="font-size: 0.72rem;"
                                      th:text="'-' + ${#numbers.formatDecimal(item.product.discount, 0, 0)} + '%'"></span>
                                <small class="text-muted text-decoration-line-through"
                                       th:text="${item.product.calculatePrice()} + ' грн'"></small>
                                <small class="text-secondary"
                                       th:text="'(' + ${item.quantity} + ' × ' + ${#numbers.formatDecimal(item.product.calculatePrice(item.product.discount), 1, 2)} + ' грн)'"></small>
                            </div>

                            <!-- Відображення для звичайного товару без знижки -->
                            <small th:unless="${item.product.isOnSale()}" class="text-muted"
                                   th:text="${item.quantity} + ' × ' + ${item.product.calculatePrice()} + ' грн'"></small>
                        </div>

                        <!-- Підсумкова сума  -->
                        <div class="text-end">
                            <span class="fw-bold text-success"
                                  th:if="${item.product.isOnSale()}"
                                  th:text="${#numbers.formatDecimal(item.product.calculatePrice(item.product.discount) * item.quantity, 1, 2)} + ' грн'"></span>
                            <span class="fw-bold text-success"
                                  th:unless="${item.product.isOnSale()}"
                                  th:text="${#numbers.formatDecimal(item.product.calculatePrice() * item.quantity, 1, 2)} + ' грн'"></span>
                        </div>
                    </div>
                </div>

                <!-- Блок бонусів -->
                <div class="p-3 bg-light rounded-3 mb-4">
                    <div class="form-check form-switch d-flex justify-content-between align-items-center p-0 m-0">
                        <label class="form-check-label fw-medium text-dark cursor-pointer" for="useBonusesSwitch">
                            Списати доступні бонуси
                        </label>
                        <input class="form-check-input m-0 ms-2" type="checkbox" id="useBonusesSwitch" onchange="toggleBonuses(this)">
                    </div>
                    <small class="text-muted d-block mt-1">
                        На вашому рахунку: <b class="text-success" th:text="${userBonuses} + ' б.'">0 б.</b>
                    </small>
                </div>

                <div class="d-flex justify-content-between align-items-center pt-2">
                    <span class="text-muted fs-5">Разом до сплати:</span>
                    <span class="fs-3 fw-bold text-success" id="finalTotalDisplay"
                          th:text="${totalPrice} + ' грн'">0.00 грн</span>
                </div>

            </div>
        </div>

    </div>
</div>

<footer th:insert="bloks/footer :: footer"> </footer>

<script th:inline="javascript">
    const baseTotal = /*[[${totalPrice}]]*/ 0.0;
    const availableBonuses = /*[[${userBonuses}]]*/ 0;

    function toggleBonuses(switchEl) {
        let finalSum = baseTotal;
        const totalDisplay = document.getElementById('finalTotalDisplay');
        const hiddenTotalInput = document.getElementById('hiddenTotalSum');
        const hiddenBonusInput = document.getElementById('hiddenUseBonuses');

        if (switchEl.checked) {
            finalSum = Math.max(0, baseTotal - availableBonuses);
            hiddenBonusInput.value = "true";
        } else {
            hiddenBonusInput.value = "false";
        }

        finalSum = Math.round(finalSum * 100) / 100;
        totalDisplay.innerText = finalSum.toFixed(2) + ' грн';
        hiddenTotalInput.value = finalSum;
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Оформлення замовлення</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">

<header th:insert="bloks/header :: header"> </header>

<div class="container my-5 py-4">
    <div class="row g-5">

        <div class="col-lg-7">
            <div class="card border-0 p-4 p-md-5 rounded-4 bg-white shadow-sm">
                <h3 class="fw-bold text-dark mb-4">Оформлення замовлення</h3>

                <form action="/orders/create" method="post" id="orderForm">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label fw-medium text-secondary">Ім'я та Прізвище</label>
                            <input type="text" name="customerName" class="form-control rounded-3 p-3 border-light bg-light" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-medium text-secondary">Номер телефону</label>
                            <input type="tel" name="customerPhone" class="form-control rounded-3 p-3 border-light bg-light" placeholder="+380" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-medium text-secondary">Адреса доставки (Нова Пошта / Укрпошта)</label>
                            <textarea name="shippingAddress" class="form-control rounded-3 p-3 border-light bg-light" rows="3" required></textarea>
                        </div>
                    </div>

                    <input type="hidden" name="totalSum" th:value="${totalPrice}">

                    <div class="mt-4 pt-2">
                        <button type="submit" class="btn btn-success btn-lg rounded-3 fw-semibold w-100" style="padding: 14px 28px; background-color: #2e7d32; border-color: #2e7d32;">
                            Підтвердити замовлення
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="card border-0 p-4 rounded-4 bg-white shadow-sm sticky-top" style="top: 20px;">
                <h4 class="fw-bold text-dark mb-4">Ваше замовлення</h4>

                <div class="mb-4" style="max-height: 240px; overflow-y: auto;">
                    <div th:each="item : ${cartItems}" class="d-flex justify-content-between align-items-center py-2 border-bottom border-light">
                        <div>
                            <h6 class="fw-bold text-dark mb-0 small" th:text="${item.product.title}">Назва товару</h6>
                            <small class="text-muted" th:text="${item.quantity} + ' x ' + ${item.product.price} + ' грн'"></small>
                        </div>
                        <span class="fw-bold text-success" th:text="${item.product.price * item.quantity} + ' грн'"></span>
                    </div>
                </div>

                <div class="card bg-light border-0 p-3 rounded-3 mb-4" sec:authorize="isAuthenticated()">
                    <div class="form-check form-switch m-0">
                        <input class="form-check-input" type="checkbox" id="useBonuses" name="useBonuses" value="true" form="orderForm">
                        <label class="form-check-label fw-semibold text-dark" for="useBonuses">
                            Списати доступні бонуси
                        </label>
                    </div>
                    <div class="text-muted small mt-1">
                        На вашому рахунку: <span class="text-success fw-bold" th:text="${userBonuses != null ? userBonuses : 0} + ' б.'">0 б.</span>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center pt-2 border-top border-light">
                    <span class="fs-5 fw-medium text-secondary">Разом до сплати:</span>
                    <span class="fs-3 fw-bold text-success">
                        <span th:text="${totalPrice}">0.00</span> <span class="fs-6 fw-normal text-muted">грн</span>
                    </span>
                </div>
            </div>
        </div>

    </div>
</div>

<footer th:insert="bloks/footer :: footer"> </footer>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Статистика</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
<header th:insert="bloks/header :: header"> </header>

<div class="container my-5" style="max-width: 750px;">
    <h3 class="fw-bold text-dark text-center mb-4">Статистика магазину</h3>

    <div class="d-flex justify-content-around align-items-center bg-white p-3 rounded-4 shadow-sm mb-4 text-center">
        <div class="flex-fill">
            <div class="text-secondary small fw-medium mb-1">Товари</div>
            <div class="fs-3 fw-bold text-success" th:text="${totalProducts}">0</div>
        </div>
        <div class="border-start" style="height: 45px;"></div>
        <div class="flex-fill">
            <div class="text-secondary small fw-medium mb-1">Категорії</div>
            <div class="fs-3 fw-bold text-success" th:text="${totalCategories}">0</div>
        </div>
        <div class="border-start" style="height: 45px;"></div>
        <div class="flex-fill">
            <div class="text-secondary small fw-medium mb-1">Замовлення</div>
            <div class="fs-3 fw-bold text-success" th:text="${totalOrders}">0</div>
        </div>
    </div>

    <!-- Картка з діаграмою  -->
    <div class="bg-white p-4 rounded-4 shadow-sm text-center">
        <h5 class="fw-bold text-dark mb-4">🪴 Товари за категоріями</h5>

        <div class="mx-auto d-flex justify-content-center align-items-center" style="max-width: 360px; height: 320px;">
            <canvas id="categoryChart"></canvas>
        </div>
    </div>
</div>

<footer th:insert="bloks/footer :: footer"> </footer>

<script th:inline="javascript">
    const labels = /*[[${chartLabels}]]*/ ['Насіння', 'Садовий інструмент', 'Декор та освітлення'];
    const data = /*[[${chartData}]]*/ [5, 4, 4];

    new Chart(document.getElementById('categoryChart'), {
        type: 'pie',
        data: {
            labels: labels,
            datasets: [{
                data: data,
                backgroundColor: [
                    '#2e7d32',
                    '#4caf50',
                    '#81c784',
                    '#a5d6a7',
                    '#ffd54f',
                    '#80cbc4'
                ],
                borderWidth: 2,
                borderColor: '#ffffff'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: {
                        usePointStyle: true,
                        pointStyle: 'circle',
                        padding: 16,
                        font: {
                            size: 13
                        }
                    }
                }
            }
        }
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

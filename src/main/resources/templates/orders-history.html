<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Історія замовлень</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">
<header th:insert="bloks/header :: header"> </header>

<div class="container my-5" style="max-width: 850px;">
    <h2 class="fw-bold text-dark mb-4 text-center">📜 Історія замовлень</h2>

    <div th:if="${#lists.isEmpty(orders)}" class="text-center py-5 bg-white rounded-4 border border-secondary-subtle shadow-sm">
        <h4 class="text-muted mb-4">Ви ще не робили замовлень у нашому магазині...</h4>
        <a href="/shop" class="btn btn-success rounded-2 px-4 py-2 fw-medium">Перейти до товарів</a>
    </div>

    <div th:unless="${#lists.isEmpty(orders)}" class="accordion" id="ordersAccordion">

        <div class="text-end mb-4">
            <form th:action="'/orders/clear'" method="post" onsubmit="return confirm('Ви впевнені, що хочете повністю видалити всю історію замовлень? Цю дію не можна скасувати!');" class="m-0">
                <button type="submit" class="btn btn-outline-danger btn-sm rounded-3 px-3 py-2 fw-medium">
                    🗑️ Очистити всю історію
                </button>
            </form>
        </div>

        <div class="accordion-item border-0 rounded-4 bg-white shadow-sm mb-3 overflow-hidden" th:each="order : ${orders}">

            <h2 class="accordion-header">
                <button class="accordion-button collapsed bg-white text-dark py-3 px-4" type="button"
                        th:data-bs-toggle="'collapse'" th:data-bs-target="'#collapse-' + ${order.id}">
                    <div class="d-flex justify-content-between w-100 align-items-center me-3">
                        <div>
                            <span class="fw-bold text-success" th:text="'Замовлення №' + ${order.id}"></span>
                            <small class="text-muted ms-3" th:text="${#temporals.format(order.orderDate, 'dd.MM.yyyy HH:mm')}"></small>
                        </div>
                        <span class="fw-bold fs-5 text-dark" th:text="${order.totalPrice} + ' грн'"></span>
                    </div>
                </button>
            </h2>

            <div th:id="'collapse-' + ${order.id}" class="accordion-collapse collapse" data-bs-parent="#ordersAccordion">
                <div class="accordion-body bg-light-subtle border-top p-4">

                    <div class="p-3 bg-white rounded-3 mb-4 border border-light shadow-sm small">
                        <div class="row g-2">
                            <div class="col-md-6">
                                <p class="mb-1 text-secondary"><strong>Отримувач:</strong> <span class="text-dark fw-medium" th:text="${order.customerName}">Ім'я</span></p>
                                <p class="mb-0 text-secondary"><strong>Телефон:</strong> <span class="text-dark" th:text="${order.customerPhone}">Телефон</span></p>
                            </div>
                            <div class="col-md-6">
                                <p class="mb-0 text-secondary"><strong>Адреса доставки:</strong> <span class="text-dark" th:text="${order.shippingAddress}">Адреса</span></p>
                            </div>
                        </div>
                    </div>

                    <table class="table table-borderless align-middle m-0">
                        <thead>
                        <tr class="text-muted small">
                            <th>Товар</th>
                            <th class="text-center">Кількість</th>
                            <th class="text-end">Ціна за шт.</th>
                            <th class="text-end">Сума</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${order.items}">
                            <td class="fw-medium text-dark" th:text="${item.product.title}">Товар</td>
                            <td class="text-center" th:text="${item.quantity} + ' шт.'">1 шт.</td>
                            <td class="text-end text-muted" th:text="${item.price} + ' грн'">0 грн</td>
                            <td class="text-end fw-bold text-success" th:text="${item.price * item.quantity} + ' грн'">0 грн</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<footer th:insert="bloks/footer :: footer"> </footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
